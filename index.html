<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Music Player UI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="player">
    <div class="album-art">
        <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=250&q=80" alt="Album Art">
    </div>

    <div class="song-info">
        <h2>Dream Vibes</h2>
        <p>Unknown Artist</p>
    </div>

    <div class="progress-container">
        <span>0:00</span>
        <div class="progress-bar">
            <div class="progress"></div>
        </div>
        <span>3:20</span>
    </div>

    <div class="controls">
        <button class="control-btn">⏮</button>
        <button class="control-btn play">▶</button>
        <button class="control-btn">⏭</button>
    </div>

    <div class="volume">
        <span>🔊</span>
        <input type="range" min="0" max="100">
    </div>
</div>

</body>
</html>
